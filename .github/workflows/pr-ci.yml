name: 🔍 PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # Ook op een push naar main. De merge-commit zelf werd anders nooit getest:
  # pull_request test de PR-head, niet wat er daadwerkelijk op main terechtkomt.
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # CI build uses PGlite for migration verification. Production/preview
          # deploys on Vercel use the environment-specific DATABASE_URL.
          # AUTH_DISABLED avoids the production-auth warning on a build machine.
          DATABASE_URL: pglite:./data/pglite-ci
          AUTH_DISABLED: "true"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          AUTH_DISABLED: "true"
