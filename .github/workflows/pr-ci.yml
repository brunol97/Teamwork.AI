name: 🔍 PR CI

on:
  pull_request:
    # No branch filter: stacked PRs (T6-T9) target other posthog/* branches
    # instead of main, and their checks must run too.
    types: [opened, synchronize, reopened]
  # Also run on pushes to main: pull_request tests the PR head, but the merge
  # commit that actually lands on main was never tested otherwise.
  push:
    branches: [main]

concurrency:
  # head_ref is empty on push events, so fall back to the ref name.
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # CI build uses PGlite for migration verification. Production/preview
          # deploys on Vercel use the environment-specific DATABASE_URL.
          # AUTH_DISABLED avoids the production-auth warning on a build machine.
          DATABASE_URL: pglite:./data/pglite-ci
          AUTH_DISABLED: "true"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply database migrations
        # Run the migration CLI before the dev server boots. Inside the dev
        # server, framework and app migrations race at boot on PGlite and can
        # deadlock; doing it first keeps the webServer start deterministic.
        run: pnpm exec tsx scripts/migrate-on-deploy.ts
        env:
          DATABASE_URL: pglite:./data/pglite-e2e

      - name: End-to-end tests
        run: pnpm test:e2e
