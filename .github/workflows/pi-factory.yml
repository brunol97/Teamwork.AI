name: 🏭 Pi Software Factory — Context Generator

# Deze workflow draait NIET Pi zelf. Pi draait in de gebruiker's Codespace.
# Deze workflow genereert alleen een context bestand en post een instructie.
#
# Flow:
#   1. Issue aangemaakt met label "pi-implement"
#   2. Deze workflow genereert .pi-factory/<issue-num>.md
#   3. Commit + push naar een feature branch
#   4. Post comment op issue met instructie voor Codespace
#   5. Gebruiker draait Pi in Codespace met dat context bestand + Matt Pocock skills
#   6. Pi implementeert → commit → push
#   7. Vercel preview deployt automatisch

on:
  issues:
    types: [labeled]

concurrency:
  group: pi-factory-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  generate-context:
    if: github.event_name == 'issues' && github.event.label.name == 'pi-implement'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch Issue Details
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            core.setOutput("number", issue.number);
            core.setOutput("title", issue.title);
            core.setOutput("body", issue.body || "");

      - name: Generate Pi Context
        run: |
          mkdir -p .pi-factory

          cat > .pi-factory/${{ steps.issue.outputs.number }}.md << 'CTX'
          # Pi Software Factory — Implementatie Context

          ## Opdracht
          Issue: #${{ steps.issue.outputs.number }}
          Titel: ${{ steps.issue.outputs.title }}

          ---

          ## User Story & Acceptance Criteria
          ${{ steps.issue.outputs.body }}

          ---

          ## Hoe te implementeren (werkwijze)

          Je hebt toegang tot Matt Pocock's skills. Gebruik deze strategie:

          1. **Begrijp het probleem eerst** — lees de user story + acceptance criteria volledig
          2. **Bekijk de huidige codebase** — check wat er al bestaat (`read` relevante files)
          3. **Maak een plan** — beschrijf kort wat je gaat bouwen voor je begint
          4. **Implementeer iteratief** — kleine stappen, testbaar na elke stap
          5. **TypeScript strict** — geen `any`, geen type errors
          6. **Test via build** — `npm run build` en `npx tsc --noEmit` moeten slagen

          ### Matt Pocock skills die je kan inzetten

          Voor deze implementatie, overweeg Matt's werkwijze:
          - `/skill:implement` — Matt's implementatie protocol (aanbevolen als beschikbaar)
          - `/skill:tdd` — als de feature complexe logica heeft, schrijf tests eerst
          - `/skill:code-review` — na implementatie, review je eigen code kritisch
          - `/skill:to-spec` — als de acceptance criteria vaag zijn, break ze eerst naar specs

          ---

          ## Tech Stack ( STRICT — afwijken is niet toegestaan )
          - Next.js 15 App Router — React Server Components als default
          - TypeScript — strict mode, geen `any`
          - Tailwind CSS — geen inline styles
          - Supabase — PostgreSQL, Auth, Storage. RLS policies verplicht.
          - PostHog — product analytics. Elke gebruikersactie tracken.
          - Vercel — Edge/Serverless deploy.

          ## Architectuur Principes
          1. Server Components default. Client components alleen voor interactiviteit.
          2. Data fetching in Server Components via `await`.
          3. Mutations via Server Actions (`"use server"`).
          4. PostHog event op elke significante gebruikersactie (client + server).
          5. Supabase RLS policies voor elke nieuwe tabel.
          6. Error boundaries en loading states.
          7. Geen secrets in client-side code.

          ## File Conventies
          - Routes: `src/app/<route>/page.tsx`
          - Layouts: `src/app/<route>/layout.tsx`
          - Server Actions: `src/app/<route>/actions.ts`
          - UI components: `src/components/`
          - Lib/utilities: `src/lib/`
          - PostHog client: `src/lib/posthog/client.ts`
          - PostHog server: `src/lib/posthog/server.ts`
          - Supabase client: `src/lib/supabase/client.ts`
          - Supabase server: `src/lib/supabase/server.ts`
          - Config: `src/lib/config.ts` (o/p environment switching)

          ## Environment Awareness
          De app draait in drie modi:
          - `development` (lokaal)
          - `preview` (Vercel PR deploy — o)
          - `production` (Vercel main deploy — p)

          Gebruik `src/lib/config.ts` voor environment switching.
          PostHog events moeten `environment` property bevatten.

          ## PostHog Tracking Checklist
          Implementeer tracking voor elke nieuwe feature:
          - [ ] Client-side: `getPostHogClient().capture("event_name", { ...getPostHogProperties() })`
          - [ ] Server-side: `getPostHogServer().capture({ distinctId: user.id, event: "...", properties: { ...getPostHogProperties() } })`
          - [ ] `$pageview` wordt al automatisch getracked via PostHogProvider

          ## Supabase Checklist
          - [ ] Nieuwe tabellen krijgen RLS policies (enabled by default)
          - [ ] Auth policies: gebruikers zien alleen eigen data
          - [ ] Gebruik `supabase db diff` om schema changes te vergelijken

          ## Deliverables
          1. Implementeer de feature volgens acceptance criteria
          2. Zorg dat `npm run build` slaagt zonder errors
          3. Zorg dat `npx tsc --noEmit` slaagt
          4. Gebruik Matt's code-review werkwijze op je eigen output
          5. Commit met message: `🏭 [PI-#${{ steps.issue.outputs.number }}] ${{ steps.issue.outputs.title }}`

          ## Wat NIET te doen
          - Geen nieuwe frameworks toevoegen (geen Redux, Zustand, etc.)
          - Geen CSS-in-JS (styled-components, emotion)
          - Geen nieuwe database (MongoDB, etc.)
          - Geen API routes maken als Server Actions voldoen
          CTX

      - name: Create Feature Branch
        run: |
          git config user.name "pi-factory[bot]"
          git config user.email "pi-factory@users.noreply.github.com"
          BRANCH="pi-factory/${{ steps.issue.outputs.number }}-$(echo '${{ steps.issue.outputs.title }}' | tr '[:upper:]' '[:lower:]' | tr ' ' '-' | tr -cd 'a-z0-9-' | cut -c1-40)"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Commit & Push Context
        run: |
          git add .pi-factory/
          git commit -m "🏭 [PI-${{ steps.issue.outputs.number }}] Context gegenereerd" || echo "No changes"
          git push origin "${{ env.BRANCH }}"

      - name: Post Instructie op Issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.issue.outputs.number }};
            const branch = process.env.BRANCH;

            const body = `## 🏭 Pi Software Factory — Context Klaar

            **Branch:** \`${branch}\`
            **Context bestand:** \`.pi-factory/${issueNumber}.md\`

            ---

            ### Stap 1: Open je Codespace
            Zorg dat je Codespace draait op de branch \`${branch}\`.

            \`\`\`bash
            git fetch
            git checkout ${branch}
            \`\`\`

            ### Stap 2: Run Pi met context + Matt Pocock skills

            **Optie A — direct met system prompt:**
            \`\`\`bash
            pi --system-prompt .pi-factory/${issueNumber}.md
            # Prompt binnen Pi: /skill:implement (als je Matt's skills hebt)
            \`\`\`

            **Optie B — binnen bestaande sessie:**
            \`\`\`
            /reload
            # Pi laadt automatisch de factory-helper extension
            # Run /factory om context te laden
            # Prompt: implementeer issue ${issueNumber}
            \`\`\`

            ### Stap 3: Commit & Push via Pi commands
            \`\`\`
            /done
            \`\`\`
            (Dit doet automatisch: git add -A → commit → TESTPLAN.md genereren → push)

            ### Stap 4: Maak Pull Request
            Ga naar GitHub en maak een PR van \`${branch}\` → \`main\`.
            Vercel maakt automatisch een **preview deploy**.

            ### Matt Pocock skills die je kan gebruiken
            - \`/skill:implement\` — Matt's implementatie protocol (aanbevolen)
            - \`/skill:tdd\` — als de feature complexe logica heeft
            - \`/skill:code-review\` — review je eigen output
            - \`/skill:to-spec\` — als de acceptance criteria vaag zijn

            ---
            *Dit comment is automatisch gegenereerd door de Pi Software Factory.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body,
            });
