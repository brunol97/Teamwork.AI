name: 🧪 TESTPLAN Validator

# Deze workflow valideert dat een Pi Factory PR een TESTPLAN.md bevat
# en post de Vercel preview URL + test instructies als comment.

on:
  pull_request:
    # No branch filter: stacked PRs (T6-T9) target other posthog/* branches
    # instead of main, and their checks must run too. The job itself still
    # only acts on pi-factory/ branches.
    types: [opened, synchronize]

jobs:
  validate:
    if: startsWith(github.head_ref, 'pi-factory/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for TESTPLAN.md
        id: check
        run: |
          if [ -f "TESTPLAN.md" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Post PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const hasTestplan = ${{ steps.check.outputs.exists }};
            const previewUrl = `https://${context.payload.pull_request.head.repo.name}-git-${context.payload.pull_request.head.ref.replace(/\//g, '-')}-${context.repo.owner}.vercel.app`;

            let body = `## 🏭 Pi Factory PR Review

            **Preview deploy:** [${previewUrl}](${previewUrl})
            *(Wacht tot Vercel build groen is — refresh deze PR voor de echte Vercel link)*

            ---

            ### Test Checklist
            - [ ] Preview URL is bereikbaar
            - [ ] Acceptatie criteria uit het originele issue zijn getest
            - [ ] PostHog Live Events toont de juiste events
            - [ ] Mobiele weergave is OK (Chrome DevTools responsive mode)
            - [ ] Geen console errors in browser
            `;

            if (!hasTestplan) {
              body += `\n\n⚠️ **TESTPLAN.md ontbreekt.** Voeg deze toe zodat de reviewer weet wat te testen.\n`;
            } else {
              body += `\n\n✅ **TESTPLAN.md gevonden.** Reviewer kan direct aan de slag.\n`;
            }

            // Zoek of er al een comment is van deze bot
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes('🏭 Pi Factory PR Review'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
